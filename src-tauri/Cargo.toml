[package]
name = "folio"
version = "0.4.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# git2 sin transports: v0 solo hace status/add/commit locales (TRD.md).
git2 = { version = "0.21", default-features = false }
# Fork mantenido de serde_yaml (archivado por dtolnay).
serde_yaml_ng = "0.10"
tauri-plugin-dialog = "2.8.1"
ureq = { version = "3.4.2", features = ["json"] }
# Contents API exige base64; GitHub parte el output en líneas de 60.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
